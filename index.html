<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
  </head>
  <body>
    <div id="app">
      <main class="layout">
        <aside class="side-panel side-panel-left" aria-label="왼쪽 정보 패널">
          <section class="stats-hud" aria-label="점수 패널">
            <p id="primary-stat-label" class="stats-hud-title">Score</p>
            <p class="stats-hud-score"><span id="score-value">0</span></p>
            <p class="stats-hud-high-score"><span id="best-label">High Score</span> <span id="high-score-value">0</span></p>
            <div class="stats-divider" aria-hidden="true"></div>
            <div class="stats-mini-list">
              <p id="stat-gravity-row" class="stats-mini-item">
                <span id="gravity-label">Gravity</span>
                <span id="gravity-value">0.020G</span>
              </p>
              <p id="stat-lines-row" class="stats-mini-item">
                <span id="lines-label">Lines</span>
                <span id="lines-value">0</span>
              </p>
              <p id="stat-margin-row" class="stats-mini-item">
                <span id="margin-label">Margin</span>
                <span id="margin-value">2:00</span>
              </p>
            </div>
          </section>

          <section class="panel-card settings-panel" aria-label="핸들링 설정">
            <h2>Handling</h2>
            <label for="das-input">DAS (ms)</label>
            <input id="das-input" type="number" step="1" />

            <label for="arr-input">ARR (ms)</label>
            <input id="arr-input" type="number" step="1" />

            <label for="sdf-input">SDF (G)</label>
            <input id="sdf-input" type="number" step="0.5" />
          </section>

          <section class="panel-card mode-panel" aria-label="게임 모드">
            <h2>Mode</h2>
            <div id="mode-toggle" class="mode-toggle" role="group" aria-label="게임 모드 선택">
              <button class="mode-option" type="button" data-mode="marathon">Marathon</button>
              <button class="mode-option" type="button" data-mode="fortyLines">40 Lines</button>
              <button class="mode-option" type="button" data-mode="blitz">BLITZ</button>
            </div>
          </section>
        </aside>

        <div class="board-anchor">
          <div id="board-grid" class="tetris-board" role="img" aria-label="10열 20행 게임 그리드"></div>
          <div id="event-toast" aria-live="polite" aria-atomic="true">
            <p id="clear-toast" class="event-toast-item clear-toast-item" hidden></p>
            <p id="combo-toast" class="event-toast-item" hidden></p>
            <p id="b2b-toast" class="event-toast-item" hidden></p>
          </div>
          <p id="perfect-clear-toast" class="perfect-clear-toast" aria-live="polite" aria-atomic="true" hidden></p>
          <section id="leaderboard-prompt" class="leaderboard-prompt" aria-label="리더보드 이름 입력" hidden>
            <form id="leaderboard-form" class="leaderboard-form">
              <p class="leaderboard-prompt-kicker">Top 20</p>
              <h2>New Record</h2>
              <p class="leaderboard-prompt-score">
                <span id="leaderboard-prompt-score-label">Score</span>
                <span id="leaderboard-prompt-score">0</span>
              </p>
              <label for="leaderboard-name-input">Name</label>
              <div class="leaderboard-submit-row">
                <input
                  id="leaderboard-name-input"
                  type="text"
                  maxlength="12"
                  autocomplete="off"
                  inputmode="text"
                  placeholder="PLAYER"
                />
                <button type="submit">Save</button>
              </div>
            </form>
          </section>
        </div>
        <div class="button-row">
          <button id="start-btn" type="button">Start</button>
          <button id="pause-btn" type="button">Pause</button>
          <button id="restart-btn" type="button">Restart</button>
        </div>

        <aside class="side-panel side-panel-right" aria-label="오른쪽 미리보기 패널">
          <section class="preview-panel" aria-label="다음 블록 패널">
            <h2>Next</h2>
            <div id="next-list" class="next-list">
              <div class="preview-grid next-grid" data-next-index="0"></div>
              <div class="preview-grid next-grid" data-next-index="1"></div>
              <div class="preview-grid next-grid" data-next-index="2"></div>
              <div class="preview-grid next-grid" data-next-index="3"></div>
              <div class="preview-grid next-grid" data-next-index="4"></div>
            </div>
          </section>

          <section class="preview-panel" aria-label="홀드 블록 패널">
            <h2>Hold</h2>
            <div id="hold-grid" class="preview-grid"></div>
          </section>

          <section class="controls-help" aria-label="조작키 안내">
            <h2>조작키</h2>
            <dl class="controls-help-list">
              <div class="controls-help-row">
                <dt>이동</dt>
                <dd><kbd>←</kbd><kbd>→</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>소프트 드롭</dt>
                <dd><kbd>↓</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>하드 드롭</dt>
                <dd><kbd>Space</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>시계 회전</dt>
                <dd><kbd>↑</kbd><kbd>X</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>반시계 회전</dt>
                <dd><kbd>Z</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>180도 회전</dt>
                <dd><kbd>A</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>홀드</dt>
                <dd><kbd>C</kbd><kbd>Shift</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>시작</dt>
                <dd><kbd>Enter</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>일시정지</dt>
                <dd><kbd>P</kbd></dd>
              </div>
              <div class="controls-help-row">
                <dt>다시 시작</dt>
                <dd><kbd>R</kbd></dd>
              </div>
            </dl>
          </section>
        </aside>
      </main>

      <aside class="leaderboard-dock" aria-label="리더보드">
        <section class="leaderboard-panel">
          <header class="leaderboard-header">
            <h2 id="leaderboard-title">Leaderboard</h2>
            <p id="leaderboard-subtitle">Top 20</p>
          </header>
          <ol id="leaderboard-list" class="leaderboard-list"></ol>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
